services:
  web:
    build:
      context: .
      dockerfile: docker/local.dockerfile
      additional_contexts:
        laravelbase: ../HTS-AppTeam-LaravelBase
    ports:
      - "127.0.0.1:8080:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080
      VINA_LOCAL_PASSWORD_LOGIN: "true"
      VINA_DEFAULT_LOCALE: en
      VINA_QUESTION_SET: en
      VINA_HIDE_ENVIRONMENT_RIBBON: "true"
      DEBUGBAR_ENABLED: "false"
      LOG_CHANNEL: stderr
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: development
      DB_USERNAME: development
      DB_PASSWORD: secret
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - assets:/var/www/html/public/build
      - ../HTS-AppTeam-LaravelBase:/var/www/html/vendor/utrecht_university/hts_appteam_laravelbase:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: development
      MARIADB_USER: development
      MARIADB_PASSWORD: secret
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

volumes:
  database:
  vendor:
  assets:
